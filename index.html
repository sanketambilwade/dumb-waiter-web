<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0d1523">
  <title>Dumb Waiter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --navy: #0d1523; --bar: #0a111c; --ink: #e6edf5; --muted: #92a2b8; --accent: #ffc425; --accent-ink: #1c1600; --track: #233349; }
    html, body { margin: 0; height: 100%; background: var(--navy); color: var(--ink); overflow: hidden;
                 font-family: "Barlow", system-ui, sans-serif; overscroll-behavior: none; }
    body { height: 100dvh; }
    #bar { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px;
           background: var(--bar); border-bottom: 2px solid var(--accent); box-sizing: border-box;
           font-family: "Barlow Condensed", "Arial Narrow", sans-serif; }
    #bar-title { font-weight: 700; font-size: 20px; letter-spacing: .3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #fullscreen { background: none; border: 0; color: var(--ink); font: 500 15px "Barlow", sans-serif; cursor: pointer;
                  display: flex; gap: 8px; align-items: center; padding: 8px; }
    #stage { position: absolute; top: 44px; left: 0; right: 0; bottom: 0; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #000; touch-action: none; outline: none; }
    #loading { position: absolute; inset: 0; background: var(--navy); display: flex; align-items: center;
               justify-content: space-between; padding: 0 8vw; gap: 4vw; }
    .intro { max-width: 440px; }
    .eyebrow { font: 600 13px "Barlow", sans-serif; letter-spacing: 2px; color: var(--accent); margin: 0 0 10px; }
    .intro h1 { font: 700 clamp(44px, 7vw, 92px)/0.95 "Barlow Condensed", "Arial Narrow", sans-serif; margin: 0 0 16px; }
    .intro .sub { font-size: 18px; margin: 0 0 24px; color: var(--ink); }
    .track { height: 4px; background: var(--track); border-radius: 2px; overflow: hidden; }
    #fill { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
    .row { display: flex; justify-content: space-between; font-size: 13px; margin-top: 8px; color: var(--muted); }
    .hint { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
    #start { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 13px 38px;
             font: 600 17px "Barlow", sans-serif; cursor: pointer; }
    #start:hover { filter: brightness(1.08); }
    #start:focus-visible, #fullscreen:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    .art { height: min(70vh, 520px); flex: 0 1 auto; }
    #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: var(--navy); color: var(--ink);
              align-items: center; justify-content: center; flex-direction: column; gap: 14px; text-align: center; padding: 24px; }
    #rotate svg { width: 64px; height: 64px; }
    @media (max-width: 640px) { .art { display: none; } #loading { padding: 0 24px; } }
    /* Phones held upright: the training is laid out for landscape. */
    @media (orientation: portrait) and (max-width: 900px) and (pointer: coarse) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <header id="bar">
    <span id="bar-title">Dumb Waiter</span>
    <button id="fullscreen" type="button" aria-label="Fullscreen">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <path d="M1 5V1h4M11 1h4v4M15 11v4h-4M5 15H1v-4"/>
      </svg>
      Fullscreen
    </button>
  </header>
  <main id="stage">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <section id="loading">
      <div class="intro">
        <p class="eyebrow">SAFETY TRAINING</p>
        <h1>Dumb Waiter</h1>
        <p class="sub">Safe to Go training</p>
        <div id="progress">
          <div class="track"><div id="fill"></div></div>
          <div class="row"><span>Loading training</span><span id="pct">0%</span></div>
          <p class="hint">The first load can take a minute. After that it opens faster.</p>
        </div>
        <button id="start" type="button" hidden>Start training</button>
      </div>
      <!-- Line art: a service lift in its shaft -->
      <svg class="art" viewBox="0 0 200 400" fill="none" stroke="#5f7590" stroke-width="4" aria-hidden="true">
        <rect x="40" y="10" width="120" height="380" rx="4"/>
        <line x1="100" y1="10" x2="100" y2="150"/>
        <rect x="58" y="150" width="84" height="96" rx="4" fill="#ffc425" fill-opacity=".18" stroke="#ffc425"/>
        <line x1="58" y1="198" x2="142" y2="198" stroke="#ffc425"/>
        <line x1="40" y1="300" x2="160" y2="300"/>
      </svg>
    </section>
  </main>
  <div id="rotate" role="alert">
    <svg viewBox="0 0 64 64" fill="none" stroke="#ffc425" stroke-width="3" aria-hidden="true">
      <rect x="14" y="6" width="22" height="40" rx="4"/>
      <path d="M44 30a14 14 0 0 1-8 24M36 54l-1-7M36 54l7 0"/>
    </svg>
    <strong>Turn your phone sideways</strong>
    <span style="color: var(--muted)">The training works best in landscape.</span>
  </div>
  <script>
    var buildUrl = "Build";
    var mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var config = {
      dataUrl: buildUrl + "/DumbWaiter.data.unityweb",
      frameworkUrl: buildUrl + "/DumbWaiter.framework.js.unityweb",
      codeUrl: buildUrl + "/DumbWaiter.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "AutoVRse",
      productName: "Amazon India VR",
      productVersion: "0.5",
    };
    // Phones and tablets: render at up to 1.5x pixel density, which keeps them cool and within memory.
    if (mobile) config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);

    var canvas = document.getElementById("unity-canvas");
    var fill = document.getElementById("fill");
    var pct = document.getElementById("pct");
    var startButton = document.getElementById("start");
    var instance = null;

    var fullscreenButton = document.getElementById("fullscreen");
    if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) fullscreenButton.hidden = true; // iPhone Safari
    fullscreenButton.onclick = function () {
      if (instance) instance.SetFullscreen(1);
      else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    };

    function setProgress(p) {
      fill.style.width = (p * 100) + "%";
      pct.textContent = Math.round(p * 100) + "%";
    }
    function fail(message) {
      document.querySelector("#progress .hint").textContent = "This device could not start the training: " + message;
    }

    // Hosts such as GitHub Pages limit file size, so the deploy step may split the data file into
    // numbered parts and set these two numbers. The parts are joined here, before Unity starts.
    var dataParts = 2, dataBytes = 158812939;
    var share = dataParts ? 0.9 : 0; // share of the progress bar used by the part downloads
    function downloadParts() {
      var got = 0, blobs = [];
      function part(i) {
        if (i === dataParts) return URL.createObjectURL(new Blob(blobs));
        return fetch(config.dataUrl + ".part" + i).then(function (r) {
          if (!r.ok) throw new Error("download failed (" + r.status + ")");
          var reader = r.body.getReader(), chunks = [];
          function pump() {
            return reader.read().then(function (s) {
              if (s.done) { blobs.push(new Blob(chunks)); return part(i + 1); }
              chunks.push(s.value);
              got += s.value.length;
              setProgress(share * Math.min(got / dataBytes, 1));
              return pump();
            });
          }
          return pump();
        });
      }
      return part(0);
    }

    function startUnity() {
      var script = document.createElement("script");
      script.src = buildUrl + "/DumbWaiter.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          setProgress(share + (1 - share) * progress);
        }).then(function (unityInstance) {
          instance = unityInstance;
          document.getElementById("progress").hidden = true;
          startButton.hidden = false;
          startButton.focus();
        }).catch(fail);
      };
      document.body.appendChild(script);
    }

    if (dataParts) {
      config.cacheControl = function () { return "no-store"; }; // the joined file is a one-off blob URL
      downloadParts().then(function (url) { config.dataUrl = url; startUnity(); }).catch(function (e) { fail(e.message); });
    } else {
      startUnity();
    }

    // Browsers only allow sound after a click, so the training waits for this one.
    startButton.onclick = function () {
      document.getElementById("loading").remove();
      canvas.focus();
      instance.SendMessage("WebModuleBoot", "Begin");
    };
  </script>
</body>
</html>
