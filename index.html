<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <title>Dumb Waiter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preload" as="image" href="poster.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #fff; --muted: #c4d0c9; --accent: #34d366; --accent-ink: #04200e; --edge: clamp(24px, 6vw, 96px); }
    html, body { margin: 0; height: 100%; background: #000; color: var(--ink); overflow: hidden;
                 font-family: "Outfit", system-ui, sans-serif; overscroll-behavior: none; }
    body { height: 100dvh; }
    #stage { position: absolute; inset: 0; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #000; touch-action: none; outline: none; }
    #inset { position: fixed; visibility: hidden; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
    #loading { position: absolute; inset: 0; display: flex; align-items: flex-end; background: #000 url("poster.jpg") center / cover no-repeat; }
    #loading::before { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.88) 0%, rgba(0,0,0,.55) 45%, rgba(0,0,0,.25) 100%); }
    #line { position: absolute; left: 0; right: 0; top: 0; height: 4px; background: rgba(255,255,255,.25); }
    #fill { height: 100%; width: 0; background: var(--accent); transition: width .25s linear; }
    .intro { position: relative; padding: 0 max(var(--edge), env(safe-area-inset-right, 0px)) clamp(20px, 7vh, 72px) max(var(--edge), env(safe-area-inset-left, 0px)); max-width: 760px; }
    .eyebrow { font-weight: 600; font-size: clamp(11px, 1.6vh, 14px); letter-spacing: .18em; color: #7ff0a4; margin: 0 0 clamp(4px, 1.2vh, 12px); }
    .intro h1 { font-weight: 300; font-size: clamp(38px, 11vh, 92px); line-height: 1.02; margin: 0 0 clamp(4px, 1.4vh, 14px); }
    .intro .sub { font-size: clamp(14px, 2.6vh, 20px); margin: 0 0 clamp(10px, 3.4vh, 30px); color: var(--muted); }
    #progress { display: flex; align-items: baseline; gap: 14px; min-height: 48px; }
    #pct { font-size: clamp(22px, 4.4vh, 34px); font-weight: 300; font-variant-numeric: tabular-nums; }
    .hint { font-size: clamp(12px, 2vh, 15px); color: var(--muted); margin: 0; }
    #start { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; min-height: 48px; padding: 0 40px;
             font: 600 clamp(16px, 2.6vh, 19px) "Outfit", sans-serif; cursor: pointer; }
    #start:hover { filter: brightness(1.08); }
    #start:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #000; color: var(--ink);
              align-items: center; justify-content: center; flex-direction: column; gap: 14px; text-align: center; padding: 24px; }
    #rotate svg { width: 64px; height: 64px; }
    #rotate span { color: var(--muted); }
    /* Phones held upright: the training is laid out for landscape. */
    @media (orientation: portrait) and (max-width: 900px) and (pointer: coarse) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <main id="stage">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <section id="loading">
      <div id="line"><div id="fill"></div></div>
      <div class="intro">
        <p class="eyebrow">SAFETY TRAINING</p>
        <h1>Dumb Waiter</h1>
        <p class="sub">Safe to Go training</p>
        <div id="progress">
          <span id="pct">0%</span>
          <p class="hint">The first visit downloads the training. Next time it opens much faster.</p>
        </div>
        <button id="start" type="button" hidden>Start training</button>
      </div>
    </section>
  </main>
  <div id="inset"></div>
  <div id="rotate" role="alert">
    <svg viewBox="0 0 64 64" fill="none" stroke="#34d366" stroke-width="3" aria-hidden="true">
      <rect x="14" y="6" width="22" height="40" rx="4"/>
      <path d="M44 30a14 14 0 0 1-8 24M36 54l-1-7M36 54l7 0"/>
    </svg>
    <strong>Turn your phone sideways</strong>
    <span>The training works best in landscape.</span>
  </div>
  <script>
    var buildUrl = "Build";
    var mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var config = {
      dataUrl: buildUrl + "/DumbWaiter.data.unityweb",
      frameworkUrl: buildUrl + "/DumbWaiter.framework.js.unityweb",
      codeUrl: buildUrl + "/DumbWaiter.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "AutoVRse",
      productName: "Amazon India VR",
      productVersion: "0.5",
    };
    // Phones and tablets: render at up to 1.5x pixel density, which keeps them cool and within memory.
    if (mobile) config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);

    var canvas = document.getElementById("unity-canvas");
    var fill = document.getElementById("fill");
    var pct = document.getElementById("pct");
    var startButton = document.getElementById("start");
    var instance = null;

    function setProgress(p) {
      fill.style.width = (p * 100) + "%";
      pct.textContent = Math.round(p * 100) + "%";
    }
    function fail(message) {
      document.querySelector("#progress .hint").textContent = "This device could not start the training: " + message;
      pct.textContent = "";
    }

    // Hosts such as GitHub Pages limit file size, so the deploy step may split the data file into
    // numbered parts and set these two numbers. The parts are joined here, before Unity starts.
    var dataParts = 0, dataBytes = 0;
    var share = dataParts ? 0.9 : 0; // share of the progress bar used by the part downloads
    function downloadParts() {
      var got = 0, blobs = [];
      function part(i) {
        if (i === dataParts) return URL.createObjectURL(new Blob(blobs));
        return fetch(config.dataUrl + ".part" + i).then(function (r) {
          if (!r.ok) throw new Error("download failed (" + r.status + ")");
          var reader = r.body.getReader(), chunks = [];
          function pump() {
            return reader.read().then(function (s) {
              if (s.done) { blobs.push(new Blob(chunks)); return part(i + 1); }
              chunks.push(s.value);
              got += s.value.length;
              setProgress(share * Math.min(got / dataBytes, 1));
              return pump();
            });
          }
          return pump();
        });
      }
      return part(0);
    }

    function startUnity() {
      var script = document.createElement("script");
      script.src = buildUrl + "/DumbWaiter.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          setProgress(share + (1 - share) * progress);
          // Unity's bar waits at 90% while the browser unpacks and starts everything: say so.
          if (progress >= 0.9) document.querySelector("#progress .hint").textContent = "Download finished. Getting the training ready...";
        }).then(function (unityInstance) {
          instance = unityInstance;
          document.getElementById("progress").style.display = "none";
          startButton.hidden = false;
          startButton.focus();
        }).catch(fail);
      };
      document.body.appendChild(script);
    }

    if (dataParts) {
      config.cacheControl = function () { return "no-store"; }; // the joined file is a one-off blob URL
      downloadParts().then(function (url) { config.dataUrl = url; startUnity(); }).catch(function (e) { fail(e.message); });
    } else {
      startUnity();
    }

    // Browsers only allow sound after a click, so the training waits for this one.
    startButton.onclick = function () {
      document.getElementById("loading").remove();
      canvas.focus();
      // Phones and tablets: use the whole screen, in landscape, where the browser allows it.
      var root = document.documentElement;
      if (mobile && root.requestFullscreen) {
        root.requestFullscreen().then(function () {
          if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {});
        }).catch(function () {});
      }
      instance.SendMessage("WebModuleBoot", "Begin");
    };
  </script>
</body>
</html>
